<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Original engineering workspace close-up</title>
  <desc id="desc">A bright desk by a large window with a laptop displaying code, a notebook, cup, and mountain skyline.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc9ff"/>
      <stop offset=".62" stop-color="#d9efff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7ea7bd"/>
      <stop offset="1" stop-color="#c9dde8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a1c31"/>
      <stop offset="1" stop-color="#13395a"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d9e4eb"/>
      <stop offset=".45" stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#c4d2dc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#264765" flood-opacity=".22"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="fade">
        <feFuncA type="table" tableValues="0 .035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fade" mode="multiply"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="900" height="560" fill="url(#sky)"/>
    <g fill="#fff" opacity=".9">
      <ellipse cx="155" cy="90" rx="110" ry="26"/>
      <ellipse cx="258" cy="95" rx="88" ry="20"/>
      <ellipse cx="690" cy="70" rx="105" ry="24"/>
    </g>

    <path d="M0 286 112 208 210 267 330 182 455 275 590 195 715 280 805 215 900 265V355H0Z" fill="#b9d4e3" opacity=".55"/>
    <path d="M0 324 150 250 282 318 415 230 560 334 690 260 815 330 900 286V380H0Z" fill="url(#mount)" opacity=".88"/>

    <g fill="#7399b0" opacity=".92">
      <rect x="48" y="307" width="46" height="92" rx="3"/>
      <rect x="103" y="290" width="58" height="109" rx="3"/>
      <rect x="170" y="321" width="38" height="78" rx="3"/>
      <rect x="218" y="278" width="51" height="121" rx="3"/>
      <rect x="281" y="302" width="59" height="97" rx="3"/>
      <rect x="352" y="264" width="45" height="135" rx="3"/>
      <rect x="409" y="298" width="58" height="101" rx="3"/>
      <rect x="480" y="314" width="40" height="85" rx="3"/>
      <rect x="532" y="286" width="56" height="113" rx="3"/>
      <rect x="600" y="309" width="42" height="90" rx="3"/>
    </g>

    <g>
      <path d="M414 400 447 372 482 400Z" fill="#5f8298"/>
      <rect x="438" y="184" width="18" height="190" rx="5" fill="#5e849d"/>
      <rect x="442" y="155" width="10" height="32" rx="3" fill="#5e849d"/>
      <rect x="445" y="133" width="4" height="24" rx="2" fill="#5e849d"/>
      <rect x="432" y="222" width="30" height="6" fill="#9bb8c8"/>
      <rect x="432" y="260" width="30" height="6" fill="#9bb8c8"/>
      <rect x="432" y="298" width="30" height="6" fill="#9bb8c8"/>
    </g>

    <rect y="398" width="900" height="162" fill="#f6f9fb"/>
    <rect y="398" width="900" height="14" fill="#cfdae3"/>
    <rect x="650" y="0" width="18" height="398" fill="#eef4f8"/>
    <rect x="820" y="0" width="14" height="398" fill="#eef4f8"/>

    <rect x="438" y="430" width="462" height="130" fill="url(#desk)"/>

    <g transform="translate(515 340)" filter="url(#shadow)">
      <rect x="0" y="0" width="245" height="145" rx="10" fill="#172b3d"/>
      <rect x="10" y="10" width="225" height="124" rx="5" fill="url(#screen)"/>
      <rect x="26" y="27" width="58" height="7" rx="3.5" fill="#4cb8ff"/>
      <rect x="26" y="48" width="132" height="6" rx="3" fill="#355d7e"/>
      <rect x="26" y="66" width="94" height="6" rx="3" fill="#5a8cad"/>
      <rect x="26" y="84" width="150" height="6" rx="3" fill="#41769a"/>
      <rect x="26" y="102" width="118" height="6" rx="3" fill="#5b8eae"/>
      <circle cx="216" cy="22" r="3" fill="#7dccff"/>
      <path d="M-30 145h305l-32 19H0Z" fill="#8296a6"/>
      <path d="M10 145h225l10 5H2Z" fill="#b7c5cf"/>
    </g>

    <g transform="translate(462 445)">
      <rect width="45" height="58" rx="8" fill="#fbfcfd"/>
      <path d="M45 13c21 0 21 30 0 30" fill="none" stroke="#d5dee6" stroke-width="7"/>
      <ellipse cx="22.5" cy="4" rx="17" ry="4.5" fill="#d9e2e8"/>
      <ellipse cx="22.5" cy="4" rx="11" ry="3" fill="#9b7a65"/>
    </g>

    <g transform="translate(735 452)">
      <rect x="0" y="0" width="120" height="14" rx="2" fill="#5c6c7a"/>
      <rect x="5" y="19" width="112" height="13" rx="2" fill="#798895"/>
      <rect x="-2" y="37" width="126" height="13" rx="2" fill="#95a3ae"/>
    </g>

    <g transform="translate(780 360)">
      <rect x="26" y="92" width="45" height="62" rx="6" fill="#f6f9fb"/>
      <path d="M48 95c-3-38-34-47-34-47 2 30 22 45 34 47Z" fill="#63b489"/>
      <path d="M48 95c3-42 36-56 36-56-1 34-24 53-36 56Z" fill="#4f996f"/>
      <path d="M48 97c-25-20-48-14-48-14 15 22 35 24 48 14Z" fill="#78bd93"/>
    </g>
  </g>
</svg>