<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Original blue-white engineering workspace illustration</title>
  <desc id="desc">A bright editorial-style workspace overlooking a layered mountain cityscape, with a laptop, books, cup, and plant.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77c8ff"/>
      <stop offset=".52" stop-color="#cfeaff"/>
      <stop offset="1" stop-color="#f5fbff"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeef8"/>
      <stop offset="1" stop-color="#a9c9da"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab1c7"/>
      <stop offset="1" stop-color="#d2e6ef"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f99b3"/>
      <stop offset="1" stop-color="#b7d0df"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#557d98"/>
      <stop offset="1" stop-color="#83a8bf"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173854"/>
      <stop offset=".6" stop-color="#0d2438"/>
      <stop offset="1" stop-color="#0a1827"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dce7ef"/>
      <stop offset=".5" stop-color="#f6f9fb"/>
      <stop offset="1" stop-color="#c4d2dc"/>
    </linearGradient>
    <linearGradient id="plant" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ec89b"/>
      <stop offset="1" stop-color="#3d9469"/>
    </linearGradient>
    <filter id="blur8" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
