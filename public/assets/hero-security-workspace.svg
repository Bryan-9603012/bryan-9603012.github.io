    <rect x="0" y="0" width="158" height="19" rx="4" fill="#526779"/>
    <rect x="6" y="-25" width="146" height="20" rx="4" fill="#6b7f8e"/>
    <rect x="13" y="-50" width="135" height="20" rx="4" fill="#324a5e"/>
