<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
<title id="title">Original picoCTF Modular Toolkit interface preview</title>
<desc id="desc">A polished dark security-tool dashboard showing toolkit categories, modules, scan status, and report output.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08192d"/><stop offset=".6" stop-color="#0d2b49"/><stop offset="1" stop-color="#123b63"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#122e4c"/><stop offset="1" stop-color="#0a2137"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1080" height="660" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1024" height="604" rx="22" fill="#081727" stroke="#244969"/>

<rect x="28" y="28" width="210" height="604" rx="22" fill="#0d243c"/>
<text x="58" y="72" fill="#f1f7fb" font-family="Arial,sans-serif" font-size="18" font-weight="700">picoCTF Toolkit</text>
<text x="58" y="96" fill="#6f8aa2" font-family="Arial,sans-serif" font-size="11">Interactive launcher</text>

<g font-family="Arial,sans-serif" font-size="12">
  <rect x="46" y="126" width="174" height="40" rx="10" fill="#173b60"/>
  <circle cx="66" cy="146" r="7" fill="#38b6ff"/><text x="84" y="151" fill="#fff">Overview</text>
  <text x="58" y="204" fill="#8ca6bb">Web Exploitation</text>
  <text x="58" y="244" fill="#8ca6bb">Cryptography</text>
  <text x="58" y="284" fill="#8ca6bb">Forensics</text>
  <text x="58" y="324" fill="#8ca6bb">Binary Exploitation</text>
  <text x="58" y="386" fill="#5f7990" font-size="10">REPORTS</text>
  <text x="58" y="418" fill="#8ca6bb">Latest report</text>
  <text x="58" y="448" fill="#8ca6bb">Run history</text>
</g>

<rect x="238" y="28" width="814" height="66" rx="22" fill="#102a46"/>
<circle cx="270" cy="61" r="8" fill="#2e8cff"/>
<text x="292" y="66" fill="#e8f1f7" font-family="Arial,sans-serif" font-size="14" font-weight="700">Security Workspace</text>
<rect x="770" y="47" width="110" height="28" rx="14" fill="#163a5d"/>
<text x="795" y="65" fill="#8dcfff" font-family="Arial,sans-serif" font-size="10">mode: ctf</text>
<rect x="894" y="47" width="124" height="28" rx="14" fill="#0e5da3"/>
<text x="922" y="65" fill="#fff" font-family="Arial,sans-serif" font-size="10">Run toolkit</text>

<g filter="url(#shadow)">
  <rect x="262" y="118" width="224" height="172" rx="16" fill="url(#card)" stroke="#2b5475"/>
  <rect x="502" y="118" width="248" height="172" rx="16" fill="url(#card)" stroke="#2b5475"/>
  <rect x="766" y="118" width="258" height="172" rx="16" fill="url(#card)" stroke="#2b5475"/>
</g>

<g font-family="Arial,sans-serif">
  <circle cx="298" cy="158" r="18" fill="#0d76d8"/>
  <text x="330" y="155" fill="#e8f2f8" font-size="13" font-weight="700">Hunter-2</text>
  <text x="330" y="176" fill="#7894ac" font-size="10">Web scanner</text>
  <rect x="286" y="212" width="167" height="10" rx="5" fill="#2d5575"/>
  <rect x="286" y="236" width="116" height="8" rx="4" fill="#537896"/>

  <circle cx="538" cy="158" r="18" fill="#6b56d9"/>
  <text x="570" y="155" fill="#e8f2f8" font-size="13" font-weight="700">Decode Helper</text>
  <text x="570" y="176" fill="#7894ac" font-size="10">Crypto / transforms</text>
  <rect x="526" y="212" width="190" height="10" rx="5" fill="#2d5575"/>
  <rect x="526" y="236" width="136" height="8" rx="4" fill="#537896"/>

  <circle cx="802" cy="158" r="18" fill="#2fa38a"/>
  <text x="834" y="155" fill="#e8f2f8" font-size="13" font-weight="700">ArtifactScope</text>
  <text x="834" y="176" fill="#7894ac" font-size="10">Forensics</text>
  <rect x="790" y="212" width="195" height="10" rx="5" fill="#2d5575"/>
  <rect x="790" y="236" width="144" height="8" rx="4" fill="#537896"/>
</g>

<rect x="262" y="314" width="762" height="286" rx="16" fill="#0c2137" stroke="#2b5475"/>
<text x="286" y="347" fill="#e9f2f8" font-family="Arial,sans-serif" font-size="13" font-weight="700">Run output</text>
<rect x="870" y="329" width="130" height="28" rx="14" fill="#143a5d"/>
<circle cx="890" cy="343" r="5" fill="#42d392"/>
<text x="904" y="347" fill="#9ec9b8" font-family="Arial,sans-serif" font-size="10">completed</text>

<g font-family="monospace" font-size="11">
  <text x="288" y="390" fill="#54c3ff">$ python ctf.py web target --mode ctf --passive</text>
  <text x="288" y="420" fill="#9fb5c8">[+] Hunter-2 initialized</text>
  <text x="288" y="448" fill="#9fb5c8">[+] passive checks complete</text>
  <text x="288" y="476" fill="#67d6a3">[+] report written: report.md</text>
</g>
<rect x="286" y="510" width="210" height="50" rx="10" fill="#102c48"/>
<text x="304" y="532" fill="#7f9ab1" font-family="Arial,sans-serif" font-size="9">Findings</text>
<text x="304" y="550" fill="#f2f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="700">12 checks · 3 hints</text>
<rect x="514" y="510" width="210" height="50" rx="10" fill="#102c48"/>
<text x="532" y="532" fill="#7f9ab1" font-family="Arial,sans-serif" font-size="9">Report</text>
<text x="532" y="550" fill="#f2f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="700">MD + JSON</text>
</svg>