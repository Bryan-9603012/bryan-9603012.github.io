<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Original cybersecurity engineering workspace</title>
  <desc id="desc">A bright security engineering desk with code, terminal output, network visualization, books and a generic mountain city skyline.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78c9ff"/>
      <stop offset=".55" stop-color="#d9efff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7da5bc"/>
      <stop offset="1" stop-color="#c7dde8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08182a"/>
      <stop offset="1" stop-color="#123b5f"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d9e5ed"/>
      <stop offset=".45" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#becdd8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#244461" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#sky)"/>
  <rect x="1180" y="0" width="14" height="424" fill="#ffffff" opacity=".72"/>
  <rect x="1400" y="0" width="12" height="424" fill="#ffffff" opacity=".62"/>
  <rect x="1185" y="0" width="2" height="424" fill="#91b7cf" opacity=".25"/>
  <rect x="1404" y="0" width="2" height="424" fill="#91b7cf" opacity=".22"/>
  <path d="M1220 10 1495 245" stroke="#ffffff" stroke-width="8" opacity=".16"/>
  <path d="M1270 0 1548 230" stroke="#ffffff" stroke-width="3" opacity=".18"/>
  <g fill="#fff" opacity=".9" filter="url(#soft)">
    <ellipse cx="355" cy="72" rx="138" ry="28"/>
    <ellipse cx="485" cy="76" rx="90" ry="21"/>
    <ellipse cx="1130" cy="62" rx="130" ry="26"/>
  </g>

  <path d="M0 308 160 215 305 284 470 190 646 296 825 206 1010 300 1180 220 1380 290 1600 208V390H0Z" fill="#b7d5e4" opacity=".58"/>
  <path d="M0 355 190 276 360 344 540 254 720 356 900 270 1080 354 1260 262 1440 346 1600 298V420H0Z" fill="url(#mount)" opacity=".88"/>

