name: Portfolio build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch pinned NiYu webfont
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/fonts
          curl --fail --location --retry 3 --output public/fonts/NiYu-Regular.woff2 https://raw.githubusercontent.com/01460421/01460421.github.io/71f5b613529ee51d8a2772e52eadc0a2bb2cf936/fonts/NiYu-Regular.woff2
          test "$(git hash-object public/fonts/NiYu-Regular.woff2)" = "ba6fdbba81ccb710cf67424d5eec2610cfe99a63"
          test "$(git hash-object public/licenses/NiYu-OFL.txt)" = "c4fd9a535e873d339a0f1241258a1aa04c3fbaa6"
      - run: npm run build
      - name: Verify deployed font asset
        run: |
          test "$(git hash-object dist/fonts/NiYu-Regular.woff2)" = "ba6fdbba81ccb710cf67424d5eec2610cfe99a63"
          test -f dist/licenses/NiYu-OFL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: portfolio-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: _portfolio_dist
      - name: Publish verified build to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          test -f _portfolio_dist/index.html
          test -d _portfolio_dist/assets
          rm -rf assets
          cp -a _portfolio_dist/. .
          rm -rf _portfolio_dist
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "deploy: portfolio ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
