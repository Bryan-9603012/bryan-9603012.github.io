    <text x="28" y="38" fill="#5ac4ff" font-family="monospace" font-size="13">security-lab</text>
    <text x="28" y="62" fill="#8ab7d6" font-family="monospace" font-size="11">$ scan --mode safe</text>
    <text x="28" y="83" fill="#65d9a0" font-family="monospace" font-size="11">✓ report generated</text>
    <text x="28" y="104" fill="#8ab7d6" font-family="monospace" font-size="11">evidence.json</text>
